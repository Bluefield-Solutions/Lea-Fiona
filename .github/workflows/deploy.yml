          B64EOF
            tr -d ' \t\r\n' < /tmp/payload.b64 | base64 -d > /tmp/payload.zip
            unzip -o /tmp/payload.zip -d .
            git config user.name "lea-fiona-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Versions-Stempel nachgeliefert (eingebettetes Paket)" || echo "nichts zu committen"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || echo "Push fehlgeschlagen - Build laeuft trotzdem mit den entpackten Dateien weiter."
          fi

      - name: Paket(e) anwenden (Textpaket .b64 oder .zip; root oder incoming/)
        run: |
          shopt -s nullglob
          b64s=(bundle*.b64 incoming/*.b64)
          for b in "${b64s[@]}"; do
            echo "== Dekodiere $b -> ${b%.b64}.zip =="
            tr -d ' \t\r\n' < "$b" | base64 -d > "${b%.b64}.zip"
            rm -f "$b"
          done
          zips=(bundle*.zip incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Kein Paket gefunden - normaler Build."
          else
            for z in "${zips[@]}"; do
              echo "== Entpacke $z =="
              unzip -o "$z" -d .
            done
            rm -f "${zips[@]}"
            git config user.name "lea-fiona-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Paket angewendet + aufgeraeumt" || echo "nichts zu committen"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || echo "Push fehlgeschlagen - Build laeuft trotzdem weiter."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Abhaengigkeiten installieren
        run: npm ci
      - name: Spiel bauen (autarke index.html)
        run: npm run build:standalone
      - name: Web-App-Ordner bauen (Icons/Splash/Manifest/SW)
        run: node tools/build-webapp.mjs
      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
