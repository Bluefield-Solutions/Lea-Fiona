name: Build & Deploy (GitHub Pages)

# Ein-Datei-Ablauf (iOS-sicher):
#  - Du laedst NUR EINE Textdatei hoch (diese deploy.yml). Sie bringt den
#    Versions-Stempel als eingebettetes Base64-Paket selbst mit und wendet es
#    EINMALIG an (Guard: passiert nur, solange der Stempel fehlt).
#  - Zusaetzlich bleibt der generische Paket-Ablauf: kuenftig kannst du EIN
#    Textpaket `bundle-*.b64` (oder eine `.zip`) hochladen -> wird entpackt,
#    committet, deployt. `.b64` ist wichtig, weil iOS `.zip` gern selbst entpackt.
# Voraussetzung (einmalig): Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions-Stempel einmalig nachliefern (falls noch nicht vorhanden)
        run: |
          if grep -q "__BUILD_ID__" client/src/pages/game.tsx 2>/dev/null; then
            echo "Stempel bereits vorhanden - nichts zu tun."
          else
            echo "Stempel fehlt - wende eingebettetes Paket an."
