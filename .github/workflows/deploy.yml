name: Build & Deploy (GitHub Pages)

# Bei jedem Push auf main baut GitHub das Spiel selbst und veröffentlicht es.
# Voraussetzung (einmalig): Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deploy gleichzeitig; laufende ältere abbrechen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Spiel bauen (autarke index.html)
        run: npm run build:standalone
      - name: Web-App-Ordner bauen (Icons/Splash/Manifest/SW)
        run: node tools/build-webapp.mjs
      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
